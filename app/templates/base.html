<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ReparaCampus{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div>
      <strong>ReparaCampus</strong>
      <span class="subtitle">Incidencias de infraestructura</span>
    </div>
    {% if g.user %}
      <div class="session">
        <span>{{ g.user['display_name'] }} · {{ g.user['role'] }}</span>
        <form method="post" action="{{ url_for('auth.logout') }}">
          <button class="secondary" type="submit">Cerrar sesión</button>
        </form>
      </div>
    {% endif %}
  </header>

  <main class="container">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
